<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Raphaël Farge</title>
  <desc id="d">Raphaël Farge — Java and Spring Boot developer, full-stack and systems engineering</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#181a25"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7956cc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7956cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b0f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7956cc" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#7956cc"/>
      <stop offset="0.7" stop-color="#6db33f"/>
      <stop offset="1" stop-color="#6db33f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Inter', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; white-space: pre; }
    .line { opacity: 0; animation: fadeIn .5s ease forwards; }
    .l1 { animation-delay: .4s } .l2 { animation-delay: .8s } .l3 { animation-delay: 1.2s }
    .l4 { animation-delay: 1.6s } .l5 { animation-delay: 2.0s } .l6 { animation-delay: 2.4s } .l7 { animation-delay: 2.8s }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .rise { opacity: 0; animation: rise .8s ease forwards; }
    @keyframes fadeIn { to { opacity: 1 } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) {
      .line, .rise { animation: none; opacity: 1; }
      .cursor, .float { animation: none; }
    }
  </style>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- bottom accent line -->
    <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>

    <!-- left: text block -->
    <g class="rise">
      <text x="60" y="88" class="mono" font-size="14" fill="#7956cc" letter-spacing="0.5">// software engineering @ epitech · bordeaux</text>
      <text x="60" y="160" class="sans" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Raphaël Farge</text>
      <text x="60" y="200" class="sans" font-size="21" fill="#c9d1d9">Java &amp; Spring Boot <tspan fill="#7956cc">·</tspan> Full-stack <tspan fill="#7956cc">·</tspan> Systems engineering</text>
    </g>

    <!-- chips -->
    <g class="rise" style="animation-delay:.25s">
      <g class="mono" font-size="13" font-weight="600" text-anchor="middle">
        <rect x="60" y="226" width="64" height="32" rx="16" fill="#ed8b00" fill-opacity="0.14" stroke="#ed8b00" stroke-opacity="0.6"/>
        <text x="92" y="247" fill="#ffb454">Java</text>

        <rect x="134" y="226" width="116" height="32" rx="16" fill="#6db33f" fill-opacity="0.14" stroke="#6db33f" stroke-opacity="0.6"/>
        <text x="192" y="247" fill="#8fd16a">Spring Boot</text>

        <rect x="260" y="226" width="96" height="32" rx="16" fill="#61dafb" fill-opacity="0.12" stroke="#61dafb" stroke-opacity="0.55"/>
        <text x="308" y="247" fill="#7fe3ff">React/TS</text>

        <rect x="366" y="226" width="96" height="32" rx="16" fill="#f74c00" fill-opacity="0.12" stroke="#f74c00" stroke-opacity="0.55"/>
        <text x="414" y="247" fill="#ff8a5c">Rust/C++</text>

        <rect x="472" y="226" width="100" height="32" rx="16" fill="#4169e1" fill-opacity="0.14" stroke="#4169e1" stroke-opacity="0.6"/>
        <text x="522" y="247" fill="#8aa4ff">PostgreSQL</text>
      </g>
    </g>

    <!-- right: code card -->
    <g class="float">
      <g filter="url(#shadow)">
        <rect x="690" y="45" width="450" height="230" rx="14" fill="#0b0e14" stroke="#7956cc" stroke-opacity="0.45"/>
      </g>
      <!-- title bar -->
      <path d="M690 59a14 14 0 0 1 14-14h422a14 14 0 0 1 14 14v22H690z" fill="#161b26"/>
      <line x1="690" y1="81" x2="1140" y2="81" stroke="#7956cc" stroke-opacity="0.25"/>
      <circle cx="712" cy="63" r="5.5" fill="#ff5f57"/>
      <circle cx="732" cy="63" r="5.5" fill="#febc2e"/>
      <circle cx="752" cy="63" r="5.5" fill="#28c840"/>
      <text x="915" y="67" class="mono" font-size="12" fill="#6e7681" text-anchor="middle">SyncController.java</text>

      <!-- code -->
      <g class="mono" font-size="14">
        <text x="714" y="112" class="line l1"><tspan fill="#d2a8ff">@PostMapping</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#a5d6ff">"/sync"</tspan><tspan fill="#c9d1d9">)</tspan></text>
        <text x="714" y="136" class="line l2"><tspan fill="#ff7b72">public</tspan><tspan fill="#c9d1d9"> ResponseEntity&lt;?&gt; </tspan><tspan fill="#d2a8ff">replay</tspan><tspan fill="#c9d1d9">(</tspan></text>
        <text x="714" y="160" class="line l3"><tspan fill="#c9d1d9">    </tspan><tspan fill="#d2a8ff">@RequestBody</tspan><tspan fill="#c9d1d9"> Batch b) {</tspan></text>
        <text x="714" y="184" class="line l4"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">if</tspan><tspan fill="#c9d1d9"> (seen(b.id())) </tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#c9d1d9"> ok();</tspan></text>
        <text x="714" y="208" class="line l5"><tspan fill="#c9d1d9">  service.apply(b);</tspan></text>
        <text x="714" y="232" class="line l6"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#c9d1d9"> ok();</tspan></text>
        <text x="714" y="256" class="line l7"><tspan fill="#c9d1d9">}</tspan><tspan class="cursor" fill="#7956cc">▌</tspan></text>
      </g>
    </g>
  </g>

  <!-- outer border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#7956cc" stroke-opacity="0.3"/>
</svg>
